<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#04060d">
<title>SNAPSHOT</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Manrope:wght@300;500&display=swap" rel="stylesheet">
<style>/* SNAPSHOT interface: quiet, wide-tracked type, glass controls. --acc / --hi follow the current environment (set by art.js). */
:root{--acc:#7fb4ff;--hi:#d6e6ff;--bg:#04060d;color-scheme:dark;
  --font:"Syncopate","Michroma","Eurostile","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Manrope","Avenir Next","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--hi);overflow:hidden;overscroll-behavior:none;font-family:var(--body)}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:space-between;align-items:center;text-align:center;
  padding:calc(env(safe-area-inset-top,0px) + 9vh) 28px calc(env(safe-area-inset-bottom,0px) + 6vh);pointer-events:none;
  transition:opacity .5s ease,visibility .5s}
.ov.hid,.hid{opacity:0;visibility:hidden}
.ov .btn,.ov .sw,.lnk{pointer-events:auto}
.blk{display:flex;flex-direction:column;align-items:center;gap:15px;width:100%}
.ov:not(.hid) .blk>*{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
.ov:not(.hid) .blk>*:nth-child(2){animation-delay:.08s}.ov:not(.hid) .blk>*:nth-child(3){animation-delay:.16s}
.ov:not(.hid) .blk>*:nth-child(4){animation-delay:.24s}.ov:not(.hid) .blk>*:nth-child(5){animation-delay:.3s}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
/* brand mark: a rotating chrome ring with a gap, the same object the game is about */
.mark{width:58px;height:58px;border-radius:50%;margin-bottom:4px;animation:spin 16s linear infinite;
  background:conic-gradient(from 30deg,transparent 0 58deg,#fff 58deg,#8da0c0 140deg,#0b1220 215deg,#e8f1ff 290deg,transparent 290deg 360deg);
  -webkit-mask:radial-gradient(circle,transparent 20px,#000 21px,#000 27px,transparent 28px);mask:radial-gradient(circle,transparent 20px,#000 21px,#000 27px,transparent 28px);
  filter:drop-shadow(0 4px 10px rgba(0,0,0,.6))}
@keyframes spin{to{transform:rotate(360deg)}}
h1,h2{margin:0;font-family:var(--font);font-weight:700;line-height:1;text-transform:uppercase}
h1{font-size:clamp(25px,8vmin,44px);letter-spacing:.34em;margin-right:-.34em;
  background:linear-gradient(180deg,#fff 0%,#d3dff3 36%,#7389ad 62%,#eaf2ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 6px 18px rgba(0,0,0,.65))}
h2{font-size:clamp(12px,3.4vmin,15px);letter-spacing:.5em;margin-right:-.5em;font-weight:400;color:rgba(214,230,255,.7)}
.tag{margin:0;font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:rgba(214,230,255,.5);font-weight:300}
.big{margin:6px 0 0;font-family:var(--font);font-weight:400;font-size:clamp(60px,18vmin,100px);line-height:1;letter-spacing:.02em;color:#fff;text-shadow:0 0 40px rgba(127,180,255,.28)}
.nb{margin:0;color:var(--acc);letter-spacing:.42em;margin-right:-.42em;font-weight:500;font-size:10px;font-family:var(--font)}
.best{margin:2px 0 0;letter-spacing:.32em;font-size:10px;color:rgba(214,230,255,.55);font-family:var(--font)}.best b{color:#fff;font-weight:700;margin-left:6px}
.hint{margin:4px 0 0;letter-spacing:.38em;font-weight:500;font-size:10px;color:var(--acc);font-family:var(--font)}
.sub{margin:0;font-size:11px;color:rgba(214,230,255,.42);letter-spacing:.1em;display:flex;align-items:center;gap:9px;font-weight:300}
.finger{width:9px;height:9px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 0 rgba(127,180,255,.5);animation:rp 2s infinite}
@keyframes rp{to{box-shadow:0 0 0 12px rgba(127,180,255,0)}}
.btn{min-width:min(74vw,280px);min-height:58px;padding:0 28px;border-radius:40px;cursor:pointer;touch-action:manipulation;color:#fff;
  font-family:var(--font);font-weight:700;font-size:12px;letter-spacing:.36em;text-indent:.36em;
  border:1px solid var(--acc);background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.03));
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  box-shadow:0 10px 30px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.28),0 0 26px rgba(127,180,255,.14);transition:transform .15s,box-shadow .3s,border-color .6s}
.btn:active{transform:scale(.97);box-shadow:0 6px 18px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.2)}
.btn.ghost{min-height:44px;background:transparent;border-color:rgba(214,230,255,.2);color:rgba(214,230,255,.72);font-size:9px;box-shadow:none}
.sw-row{display:flex;gap:14px;margin-bottom:4px}
.sw{width:22px;height:22px;border-radius:50%;border:1px solid rgba(255,255,255,.25);padding:0;cursor:pointer;position:relative}
.sw.on{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.12),0 0 14px currentColor}.sw:disabled{opacity:.2;cursor:default}
.stats{display:flex;gap:0;margin-bottom:8px}
.stats div{display:flex;flex-direction:column;gap:7px;padding:0 30px}.stats div+div{border-left:1px solid rgba(214,230,255,.16)}
.stats b{font-family:var(--font);font-weight:400;font-size:22px;color:#fff}.stats span{font-size:8px;letter-spacing:.36em;color:rgba(214,230,255,.5);font-family:var(--font)}
#snd{position:fixed;z-index:5;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;min-height:36px;padding:0 12px;border-radius:18px;
  border:1px solid rgba(214,230,255,.16);background:rgba(255,255,255,.04);color:rgba(214,230,255,.6);font:500 8px/1 var(--font);letter-spacing:.3em;cursor:pointer}
#snd[aria-pressed=true]{opacity:.45}
@media (max-height:620px){.ov{padding-top:calc(env(safe-area-inset-top,0px) + 5vh)}.mark{width:44px;height:44px}.btn{min-height:50px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="snd" class="lnk" aria-pressed="false">SOUND ON</button>

<section id="menu" class="ov">
  <div class="blk">
    <div class="mark" aria-hidden="true"></div>
    <h1>SNAPSHOT</h1>
    <p class="tag">freeze time &middot; thread the gap</p>
  </div>
  <div class="blk">
    <div id="sw" class="sw-row"></div>
    <button id="play" class="btn">PLAY</button>
    <button id="daily" class="btn ghost">DAILY CHALLENGE</button>
    <p class="best">BEST <b id="mBest">0</b></p>
    <p class="hint">TAP TO FREEZE TIME</p>
    <p class="sub"><i class="finger"></i>one finger &middot; tap anywhere</p>
  </div>
</section>

<section id="over" class="ov hid">
  <div class="blk"><h2>GAME OVER</h2><p class="big" id="oScore">0</p><p class="nb hid" id="oNew">NEW BEST</p></div>
  <div class="blk">
    <div class="stats"><div><b id="oBest">0</b><span>BEST</span></div><div><b id="oStreak">0</b><span>BEST STREAK</span></div></div>
    <button id="retry" class="btn">RETRY</button>
    <button id="toMenu" class="btn ghost">MENU</button>
  </div>
</section>

<section id="pause" class="ov hid"><div class="blk"><h2>PAUSED</h2></div><div class="blk"><button id="resume" class="btn">RESUME</button></div></section>

<script>'use strict';
/* =============================================================================================
   SNAPSHOT art system. RENDERING ONLY: reads gameplay state, never writes it.
   Hard rule: everything that belongs to an obstacle is drawn INSIDE its collision band
   (ring radius +-3.5px, gate +-4px), so the artwork can never disagree with the collision.
   Silhouette variety comes from ornaments placed beside the ring, away from the ball's path.
   Layers: base gradient > far silhouettes > mid silhouettes > light shafts > dust > [obstacles, ball, fx] > foreground > vignette
   ============================================================================================= */
const Art = (() => {
  const PI = Math.PI, TAU = PI * 2, W = 360, H = 640, TILE = 720;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, t) => a + (b - a) * t;
  const sm01 = (a, b, x) => { const t = Math.max(0, Math.min(1, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
  const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };      // deterministic 0..1, so generated artwork is designed, not random
  const rgb = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const rgba = (a, al) => 'rgba(' + (a[0] | 0) + ',' + (a[1] | 0) + ',' + (a[2] | 0) + ',' + al + ')';
  const css = a => 'rgb(' + (a[0] | 0) + ',' + (a[1] | 0) + ',' + (a[2] | 0) + ')';
  const pal = (bg, far, mid, hi, acc, dust, shaft, ed) => ({ bg: bg.map(rgb), far: rgb(far), mid: rgb(mid), hi: rgb(hi), acc: rgb(acc), dust: rgb(dust), shaft: rgb(shaft), ed: rgb(ed) });
  const FONT = '"Syncopate","Michroma","Eurostile","Avenir Next","Segoe UI",system-ui,sans-serif';

  /* ---- environments: one palette each (bg x3, far, mid, highlight, accent, dust, shaft, edge-light). Blended continuously. ---- */
  const ENV = [
    { name: 'THE VOID', p: pal(['#050914', '#0a1530', '#02040a'], '#1b2c4d', '#27405f', '#d6e6ff', '#7fb4ff', '#9fb8e0', '#6f9ae0', '#cfe2ff') },
    { name: 'THE FRACTURE', p: pal(['#09051f', '#1c0e3c', '#04020f'], '#3b2070', '#5b2d8f', '#e0f6ff', '#b08aff', '#b8a4ff', '#8f6bff', '#36e0ff') },
    { name: 'THE COLLAPSE', p: pal(['#0b0605', '#1f0e08', '#030101'], '#3d1b10', '#52250f', '#ffe6c8', '#ff8a2a', '#ffb274', '#ff6a1e', '#ff7a2a') }
  ];
  const KEYS = ['far', 'mid', 'hi', 'acc', 'dust', 'shaft', 'ed'];
  const cur = { bg: [[0, 0, 0], [0, 0, 0], [0, 0, 0]], far: [0, 0, 0], mid: [0, 0, 0], hi: [0, 0, 0], acc: [0, 0, 0], dust: [0, 0, 0], shaft: [0, 0, 0], ed: [0, 0, 0] };
  const S = { e: 0, inten: 0, Q: 1, k: 1, clock: 0, lastY: 0, shown: [false, false], toast: null, ema: 0.016, slow: 0, fast: 0, cssT: 0, vig: null, vw: 0, vh: 0 };
  const meta = new WeakMap(), grads = {}, tiles = {};
  let dbg = '';

  /* ---- visual progression: a pure function of distance travelled, so it only ever advances. Void -> Fracture -> Collapse ---- */
  const envPos = y => { const t = y / CFG.ballSpeed; return clamp((t - 15) / 55, 0, 1) + clamp((t - 70) / 60, 0, 1); };
  function setEnv(e) {
    const i = Math.min(1, Math.floor(e)), t = e - i, A = ENV[i].p, B = ENV[i + 1].p;
    for (let j = 0; j < 3; j++) for (let c = 0; c < 3; c++) cur.bg[j][c] = lerp(A.bg[j][c], B.bg[j][c], t);
    for (const k of KEYS) for (let c = 0; c < 3; c++) cur[k][c] = lerp(A[k][c], B[k][c], t);
  }
  function frame(a) {                              // once per rendered frame: progression, palette, toast, adaptive quality
    const y = a.menu ? 0 : a.ballY;
    if (y < S.lastY - 1) { S.shown = [false, false]; S.toast = null; }      // a new run began: reset presentation state only
    S.lastY = y; S.clock = a.clock; S.k = a.k || 1;
    S.e = envPos(y); S.inten = clamp(y / CFG.ballSpeed / 150, 0, 1); setEnv(S.e);
    for (let i = 0; i < 2; i++) if (!S.shown[i] && S.e >= 0.5 + i) { S.shown[i] = true; S.toast = { text: ENV[i + 1].name, t: 2.8 }; }
    if (S.toast) { S.toast.t -= a.dt; if (S.toast.t <= 0) S.toast = null; }
    S.ema = lerp(S.ema, a.dt, 0.05);                                         // adaptive quality: drop shadows / dust on slow devices, restore when fast again
    if (S.ema > 0.024) { S.slow++; S.fast = 0; } else if (S.ema < 0.0185) { S.fast++; S.slow = 0; } else { S.slow = S.fast = 0; }
    if (S.slow > 120) S.Q = 0; else if (S.fast > 600) S.Q = 1;
    S.cssT -= a.dt;
    if (S.cssT <= 0 && typeof document !== 'undefined' && document.documentElement) { S.cssT = 0.5; const st = document.documentElement.style; st.setProperty('--acc', rgba(cur.acc, 1)); st.setProperty('--hi', rgba(cur.hi, 1)); }
  }

  /* ---- background layers ---- */
  function paintTile(g, kind, e) {                 // cached 360x720 silhouettes, one per environment and depth; wrap-seamless
    const P = ENV[e].p, far = kind === 'far', n = far ? 9 : 6, base = far ? P.far : P.mid, al = far ? 0.55 : 0.8;
    for (let i = 0; i < n; i++) {
      const r0 = hash(i * 7.3 + e * 19 + (far ? 0 : 91)), r1 = hash(i * 3.1 + e * 5 + 1.7), r2 = hash(i * 9.7 + e * 2 + 4.2);
      const x = r0 * W, y = (i + r1) / n * TILE, s = (far ? 40 : 55) + r2 * (far ? 80 : 95), rot = r1 * TAU;
      for (const dy of [-TILE, 0, TILE]) {
        g.save(); g.translate(x, y + dy); g.rotate(rot); g.globalAlpha = (e === 2 && !far) ? 0.55 : al;
        const gr = g.createLinearGradient(-s, -s, s, s); gr.addColorStop(0, rgba(base, 0.9)); gr.addColorStop(1, rgba(base, 0.05));
        if (e === 0) {                              // the void: monoliths and floating rings
          if (i % 3 === 0) { g.strokeStyle = rgba(P.hi, 0.35); g.lineWidth = 1.2; g.beginPath(); g.arc(0, 0, s * 0.8, 0, TAU); g.stroke(); g.beginPath(); g.arc(0, 0, s * 0.5, 0.4, TAU - 0.4); g.stroke(); }
          else { g.fillStyle = gr; g.fillRect(-s * 0.18, -s, s * 0.36, s * 2); g.strokeStyle = rgba(P.hi, 0.3); g.lineWidth = 1; g.strokeRect(-s * 0.18, -s, s * 0.36, s * 2); }
        } else if (e === 1) {                       // the fracture: prismatic shards
          g.fillStyle = gr; g.beginPath(); g.moveTo(0, -s); g.lineTo(s * 0.55, -s * 0.1); g.lineTo(s * 0.2, s); g.lineTo(-s * 0.5, s * 0.25); g.closePath(); g.fill();
          g.strokeStyle = rgba(i % 2 ? P.ed : P.acc, 0.45); g.lineWidth = 1; g.stroke(); g.beginPath(); g.moveTo(0, -s); g.lineTo(s * 0.2, s); g.stroke();
        } else {                                    // the collapse: jagged slabs with a thin molten edge
          g.fillStyle = far ? 'rgba(27,15,11,.62)' : 'rgba(30,17,12,.5)'; g.beginPath(); g.moveTo(-s * 0.4, s); g.lineTo(-s * 0.3, -s * 0.2); g.lineTo(-s * 0.05, -s); g.lineTo(s * 0.2, -s * 0.3); g.lineTo(s * 0.45, s); g.closePath(); g.fill();
          g.strokeStyle = rgba(P.ed, 0.5); g.lineWidth = 1; g.beginPath(); g.moveTo(-s * 0.3, -s * 0.2); g.lineTo(-s * 0.05, -s); g.lineTo(s * 0.2, -s * 0.3); g.stroke();
        }
        g.restore();
      }
    }
  }
  function tile(kind, e) {
    const key = kind + e; if (tiles[key]) return tiles[key];
    const c = document.createElement('canvas'); c.width = W; c.height = TILE; paintTile(c.getContext('2d'), kind, e); return (tiles[key] = c);
  }
  const dustP = Array.from({ length: 70 }, (_, i) => ({ x: hash(i * 1.7) * W, y: hash(i * 2.9) * H, z: 0.25 + hash(i * 4.3) * 0.75, ph: hash(i * 5.1) * TAU, r: 0.7 + hash(i * 6.7) * 1.3 }));
  function base(ctx, vw, vh) {
    const g = ctx.createLinearGradient(0, 0, 0, vh); g.addColorStop(0, css(cur.bg[0])); g.addColorStop(0.55, css(cur.bg[1])); g.addColorStop(1, css(cur.bg[2]));
    ctx.fillStyle = g; ctx.fillRect(0, 0, vw, vh);
    const r = ctx.createRadialGradient(vw / 2, vh * 0.42, 0, vw / 2, vh * 0.42, vh * 0.65); r.addColorStop(0, rgba(cur.acc, 0.10 + 0.05 * S.inten + 0.05 * clamp(S.e - 1, 0, 1))); r.addColorStop(1, rgba(cur.acc, 0));
    ctx.fillStyle = r; ctx.fillRect(0, 0, vw, vh);       // (the +0.08 term is a warm backlight that exists only while e > 1, i.e. inside the Collapse: silhouettes read against it)
  }
  function layers(ctx, camY, clock) {              // logical coordinates; parallax: far 0.10, mid 0.26, dust 0.25-1.0 x camera
    const e0 = Math.min(1, Math.floor(S.e)), t = S.e - e0;
    for (const [kind, par, al] of [['far', 0.10, 0.9], ['mid', 0.26, 0.85]]) {
      const off = (((-camY * par) % TILE) + TILE) % TILE - TILE;
      for (let q = 0; q < 2; q++) {
        const alpha = (q ? t : 1 - t) * al; if (alpha < 0.01) continue;           // cross-fade between neighbouring environments
        const img = tile(kind, e0 + q); ctx.globalAlpha = alpha; ctx.drawImage(img, 0, off); ctx.drawImage(img, 0, off + TILE);
      }
    }
    ctx.globalAlpha = 1;
    if (S.Q) {                                      // light shafts: three slow slanted beams, one gradient
      const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, rgba(cur.shaft, 0.08 + 0.05 * S.inten)); g.addColorStop(1, rgba(cur.shaft, 0)); ctx.fillStyle = g;
      for (let i = 0; i < 3; i++) { const x = 40 + i * 130 + Math.sin(clock * 0.07 + i * 2) * 25, w = 26 + i * 14; ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + w, 0); ctx.lineTo(x + w - 120, H); ctx.lineTo(x - 120, H); ctx.closePath(); ctx.fill(); }
    }
    const n = S.Q ? Math.floor(22 + S.inten * 46) : 12, rise = clamp(S.e - 1, 0, 1);   // dust density grows with progress; in the collapse it rises like embers
    ctx.fillStyle = rgba(cur.dust, 1);
    for (let i = 0; i < n; i++) {
      const p = dustP[i], x = p.x + Math.sin(clock * 0.2 * p.z + p.ph) * 10, y = (((p.y - camY * 0.25 * p.z - clock * 14 * p.z * rise) % H) + H) % H;
      ctx.globalAlpha = (0.12 + 0.3 * p.z) * (0.65 + 0.35 * Math.sin(clock * 0.5 + p.ph)); ctx.fillRect(x, y, p.r * p.z * 1.6, p.r * p.z * 1.6);
    }
    ctx.globalAlpha = 1;
  }
  function foreground(ctx, camY) {                 // sparse dark edge shards that slide faster than the world; never near the playfield centre
    ctx.fillStyle = 'rgba(2,3,8,' + (0.16 + 0.22 * S.inten) + ')';
    for (let i = 0; i < 2; i++) {
      const sx = i ? -1 : 1, x0 = i ? W : 0, y = (((i * 330 - camY * 1.3) % 760) + 760) % 760 - 60, w = 18 + hash(i * 9.1) * 16, h = 120 + hash(i * 4.4) * 110;
      ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x0 + sx * w, y + h * 0.45); ctx.lineTo(x0 + sx * w * 0.4, y + h); ctx.lineTo(x0, y + h); ctx.closePath(); ctx.fill();
    }
  }
  function vignette(ctx, vw, vh) {
    if (!S.vig || S.vw !== vw || S.vh !== vh) {
      S.vw = vw; S.vh = vh; S.vig = ctx.createRadialGradient(vw / 2, vh / 2, Math.min(vw, vh) * 0.42, vw / 2, vh / 2, Math.hypot(vw, vh) * 0.62);
      S.vig.addColorStop(0, 'rgba(0,0,0,0)'); S.vig.addColorStop(1, 'rgba(0,0,0,.6)');
    }
    ctx.fillStyle = S.vig; ctx.fillRect(0, 0, vw, vh);
  }

  /* ---- ball (the visual focus: brightest, cleanest object on screen) ---- */
  function ball(ctx, x, y, R, hex) {
    const c = rgb(hex), lite = [lerp(c[0], 255, 0.55), lerp(c[1], 255, 0.55), lerp(c[2], 255, 0.55)];
    const h = ctx.createRadialGradient(x, y, R * 0.6, x, y, R * 3.6); h.addColorStop(0, rgba(c, 0.30)); h.addColorStop(1, rgba(c, 0));
    ctx.fillStyle = h; ctx.beginPath(); ctx.arc(x, y, R * 3.6, 0, TAU); ctx.fill();
    const g = ctx.createRadialGradient(x - R * 0.38, y - R * 0.42, R * 0.08, x, y, R * 1.05);
    g.addColorStop(0, '#fff'); g.addColorStop(0.22, rgba(lite, 1)); g.addColorStop(0.65, rgba(c, 1)); g.addColorStop(1, rgba([c[0] * 0.28, c[1] * 0.28, c[2] * 0.34], 1));
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, R, 0, TAU); ctx.fill();
    ctx.strokeStyle = rgba(cur.hi, 0.55); ctx.lineWidth = 0.9; ctx.beginPath(); ctx.arc(x, y, R - 0.45, PI * 0.1, PI * 0.75); ctx.stroke();       // rim light
  }

  /* ---- sculptural obstacles ---- */
  const conic = (ctx, st, stops) => { const g = ctx.createConicGradient ? ctx.createConicGradient(st, 0, 0) : ctx.createLinearGradient(-90, -90, 90, 90); stops.forEach(s => g.addColorStop(s[0], s[1])); return g; };
  function prep(ctx) {                             // shared gradients, built once per frame at the origin and reused by every obstacle (they follow the CTM)
    const hi = rgba(cur.hi, 1);
    grads.chrome = conic(ctx, -2.3, [[0, hi], [0.1, '#8fa2c2'], [0.24, '#0a111e'], [0.4, '#56698a'], [0.5, hi], [0.62, '#222d44'], [0.78, '#04070d'], [0.9, '#a6b7d4'], [1, hi]]);

         'TAP WINDOW ' + (dg.win || 0).toFixed(2) + 's' + (dg.free ? ' +free' : ''), 'FREEZE CD ' + Math.max(0, ar.cd).toFixed(2), 'PHASE ' + (ar.stage + 1) + ' ' + STAGES[ar.stage].name + '  L ' + (dg.L || 0).toFixed(2) + '  GAP ' + ((dg.edge || 0) | 0) + 'px  REPEATS ' + G.dupes + '/' + G.phrases, 'RUN ' + (G.prof ? G.prof.name : '') + '  PHRASE ' + (ar.pid || '-') + (ar.mod ? '  MOD ' + ar.mod : '')].forEach((t, i) => text(t, W / 2, 152 + i * 13, 10, '#ffd24d', 0.85)); }
      if (ar && ar.mod) text(ar.mod + ' \u00d7' + ar.sm, W / 2, 148, 10, '#ffd24d', 0.85);
      if (G.pop) { G.pop.t -= dt * 1.6; if (G.pop.t > 0) text(G.pop.text, W / 2, CFG.ballScreenY - 52 - (1 - G.pop.t) * 14, 12, G.pop.col, Math.min(1, G.pop.t * 1.5)); else G.pop = null; }
      if (G.streak >= 2) text(G.streak + ' PERFECT  \u00d7' + G.mult, W / 2, 112, 11, Art.col('acc', 1), 0.95);
      if (G.score < 2 && G.state === 'PLAYING') text('TAP TO FREEZE THE RING', W / 2, H - 70, 10, Art.col('hi', 1), 0.3 + 0.2 * Math.sin(G.clock * 3));
      const tz = Art.state.toast; if (tz) text(tz.text, W / 2, 168, 12, Art.col('acc', 1), Math.min(1, tz.t * 2, (2.8 - tz.t) * 2), 600);   // environment name when the world changes
    }
    if (G.banner) { G.banner.t -= dt; if (G.banner.t > 0) text(G.banner.text, W / 2, 196, 17, Art.col('hi', 1), Math.min(1, G.banner.t), 400); else G.banner = null; }
  }
  Art.foreground(ctx, camY);                                                  // sparse foreground shards
  ctx.setTransform(1, 0, 0, 1, 0, 0); Art.vignette(ctx, cv.width, cv.height);
}

/* ================= MAIN LOOP ================= */
let last = 0, acc = 0;
function frame(ts) {
  requestAnimationFrame(frame); G.sync = false;
  const dt = Math.min(0.1, (ts - last) / 1000 || 0); last = ts; G.clock += dt;
  if (G.state === 'PLAYING') {
    acc += dt; let k = 0;
    while (acc >= STEP && k++ < 8) { update(STEP); acc -= STEP; if (G.state !== 'PLAYING') break; }
    if (k >= 8) acc = 0;
  } else if (G.state === 'DYING') { G.dieT += dt; if (G.dieT > 0.55) showOver(); }
  if (G.job && G.state !== 'PAUSED') pumpJob(3);   // <= ~3ms of ring generation per frame
  if (G.state !== 'PAUSED') {
    const a = activeRing(), pf = (a && a.frz > 0 && G.state === 'PLAYING') ? 0.12 : 1;  // particles hang while frozen
    for (const p of P) if (p.a) { p.l -= dt * pf; if (p.l <= 0) { p.a = 0; continue; } p.x += p.vx * dt * pf; p.y += p.vy * dt * pf; p.vx *= 0.985; p.vy *= 0.985; }
  }
  draw(dt);
}

/* ================= BOOT ================= */
function boot() {
  cv = $('c'); ctx = cv.getContext('2d'); Store.load(); resize(); buildMenu(); syncMute();
  window.addEventListener('resize', resize); window.addEventListener('orientationchange', resize);
  cv.addEventListener('pointerdown', e => { e.preventDefault(); tap(); });
  document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
  $('play').onclick = () => start(false); $('daily').onclick = () => start(true); $('retry').onclick = retry; $('toMenu').onclick = toMenu; $('resume').onclick = resume;
  $('over').addEventListener('pointerdown', e => { if (e.target === $('over')) retry(); });
  $('snd').onclick = () => { Store.d.mute = !Store.d.mute; Store.save(); syncMute(); Snd.init(); };
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
  window.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); if (e.repeat) return;
      ({ MENU: start, PLAYING: tap, GAME_OVER: retry, PAUSED: resume })[G.state]?.(); }
    if (e.code === 'Escape') pause();
  });
  window.SNAPSHOT = { G, CFG, update, reset, tap, start, STEP, measure, STAGES, stageOf, secDist, diff, lvl, PR, validate, passes, tierOf, PHRASES, heavy, diag, compose, simil, UNLOCK };   // debug / test hook
  requestAnimationFrame(frame);
}
boot();
</script>
