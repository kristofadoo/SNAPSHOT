<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#04060d">
<title>SNAPSHOT</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Manrope:wght@300;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="c"></canvas>
<button id="snd" class="lnk" aria-pressed="false">SOUND ON</button>

<section id="menu" class="ov">
  <div class="blk">
    <div class="mark" aria-hidden="true"></div>
    <h1>SNAPSHOT</h1>
    <p class="tag">freeze time &middot; thread the gap</p>
  </div>
  <div class="blk">
    <div id="sw" class="sw-row"></div>
    <button id="play" class="btn">PLAY</button>
    <button id="daily" class="btn ghost">DAILY CHALLENGE</button>
    <p class="best">BEST <b id="mBest">0</b></p>
    <p class="hint">TAP TO FREEZE TIME</p>
    <p class="sub"><i class="finger"></i>one finger &middot; tap anywhere</p>
  </div>
</section>

<section id="over" class="ov hid">
  <div class="blk"><h2>GAME OVER</h2><p class="big" id="oScore">0</p><p class="nb hid" id="oNew">NEW BEST</p></div>
  <div class="blk">
    <div class="stats"><div><b id="oBest">0</b><span>BEST</span></div><div><b id="oStreak">0</b><span>BEST STREAK</span></div></div>
    <button id="retry" class="btn">RETRY</button>
    <button id="toMenu" class="btn ghost">MENU</button>
  </div>
</section>

<section id="pause" class="ov hid"><div class="blk"><h2>PAUSED</h2></div><div class="blk"><button id="resume" class="btn">RESUME</button></div></section>

<script src="art.js"></script>
<script src="game.js"></script>
</body>
</html>
